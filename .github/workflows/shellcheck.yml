name: ShellCheck

on: [push, pull_request]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check all shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name .git -prune -o -type f -name '*.sh' -print0 |
            xargs -0 -r shellcheck --severity=style
          # The watchdog embeds a runner which is written at runtime.
          runner=$(mktemp --suffix=.sh)
          trap 'rm -f "$runner"' EXIT
          sed -n "/^cat > .*<< 'EOF'$/,/^EOF$/{ /^cat > /d; /^EOF$/d; p; }" watchdog.sh > "$runner"
          test -s "$runner"
          shellcheck --severity=style "$runner"
      - name: Validate example JSON
        run: python3 -m json.tool examples/settings.local.example.json > /dev/null
      - name: Test redacted setup reports (offline)
        run: python3 -m unittest discover -s tests -v
